name: Verifica fonti Bus AMTS
on:
  push:
    branches: [codex/investigate-bus-data]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Esamina pagine pubbliche e feed
        run: |
          mkdir -p source-research
          cat > /tmp/research.py <<'PY'
          import urllib.request, urllib.parse, re, json, hashlib, datetime
          from pathlib import Path
          report = {'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pages':[],'feeds':[]}
          headers={'User-Agent':'LiotruExpress-source-research/1.0; https://github.com/AndreaGirlando/Liotru-Express','X-BusOne-Client':'LiotruExpress/source-research; https://github.com/AndreaGirlando','X-BusOne-Use':'personal'}
          def get(url, limit=3000000):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
                      data=r.read(limit+1)
                      if len(data)>limit: return {'url':url,'error':'size limit'},''
                      return {'url':url,'final_url':r.url,'status':r.status,'sha256':hashlib.sha256(data).hexdigest()},data.decode('utf-8',errors='replace')
              except Exception as e: return {'url':url,'error':str(e)},''
          pages=['https://www.moovle.me/regions/catania/','https://www.mycicero.it/amt-ct/TPWebPortal/it/']
          scripts=[]
          for url in pages:
              meta,body=get(url)
              links=[urllib.parse.urljoin(url,s) for s in re.findall(r'href=["\']([^"\']+)',body)]
              meta['line_links']=[x for x in links if any(s in x.lower() for s in ['route','line','stop','transit','156','a-ms'])][:25]
              src=[urllib.parse.urljoin(url,s) for s in re.findall(r'<script[^>]+src=["\']([^"\']+)',body)]
              meta['scripts']=src
              report['pages'].append(meta)
              scripts += [x for x in src if urllib.parse.urlsplit(x).hostname in ['www.moovle.me','moovle.me','www.mycicero.it'] and not any(w in x for w in ['jquery','bootstrap','google','analytics','leaflet'])][:8]
              for m in re.finditer(r'(?:https?://[^\s"\'<>]+|/wp-json/[^\s"\'<>]+)',body):
                  u=m.group(0)
                  if any(s in u.lower() for s in ['api','service','transit','realtime','rest','ajax']):
                      meta.setdefault('public_endpoints',[]).append(u[:250])
          report['scripts']=[]
          for url in list(dict.fromkeys(scripts))[:12]:
              meta,body=get(url)
              urls=re.findall(r"https?://[a-zA-Z0-9./_?=&%:-]+",body) + re.findall(r'["\'](/[^"\'<>\s]+)["\']',body)
              # Retain endpoint paths, never headers or credentials.
              meta['paths']=list(dict.fromkeys(u for u in urls if u and any(k in u.lower() for k in ['api','service','transit','stop','vehicle','realtime','ajax','gtfs'])))[:60]
              needles=['fetch(','axios','ajax','getTransits','GetTransits','getDepartures','getVehicles','getStops','apiUrl','api_url','serviceUrl','wpApiSettings']
              contexts=[]
              for needle in needles:
                  start=0
                  for _ in range(4):
                      pos=body.find(needle,start)
                      if pos<0:break
                      text=body[max(0,pos-60):pos+200]
                      text=re.sub(r'(?i)(authorization|api.?key|access.?token|password)(.{0,8})["\'][^"\']+["\']',r'\1: [redacted]',text)
                      contexts.append(text)
                      start=pos+len(needle)
              meta['request_contexts']=contexts
              report['scripts'].append(meta)
          for name in ['vehicle-positions','trip-updates']:
              meta,body=get('https://proxy.busone.app/amts/gtfs-rt/'+name+'.json',10000000)
              if body:
                  try:
                      obj=json.loads(body);entities=obj.get('entity',[])
                      meta['header']=obj.get('header');meta['entity_count']=len(entities)
                      sample=[]
                      for entity in entities[:8]:
                          value=entity.get('vehicle') or entity.get('trip_update') or entity.get('tripUpdate') or {}
                          sample.append(value)
                      meta['samples']=sample
                  except Exception as e:meta['parse_error']=str(e)
              report['feeds'].append(meta)

          meta,body=get('https://www.moovle.me/js/transport-app.js')
          lines=body.splitlines()
          selected=set()
          for i,line in enumerate(lines):
              if any(k in line for k in ['const url','otpEndpoint','stoptimes','realtime','realtimeState','realtimeDeparture','scheduledDeparture','stopId','fetch(']):
                  for n in range(max(0,i-2),min(len(lines),i+4)):selected.add(n)
          report['moovle_contract']=[{'line':i+1,'text':lines[i][:400]} for i in sorted(selected)][:220]
          meta,page=get('https://www.moovle.me/regions/catania/?route=1:A-MS')
          report['moovle_bootstrap']=[line.strip()[:800] for line in page.splitlines() if any(k in line for k in ['otpEndpoint','transport-app','azure-api','data-region','initialStop','apiBase'])][:20]
          for f in report['feeds']:
              samples=f.pop('samples',[])
              f['samples']=[]
              for s in samples[:3]:
                  item={k:v for k,v in s.items() if k not in ['stop_time_update','stopTimeUpdate']}
                  stops=s.get('stop_time_update',s.get('stopTimeUpdate',[]))
                  if stops:item['first_stop_updates']=stops[:2]
                  f['samples'].append(item)


          report['moovle_live']=[]
          for route in ['1:A-MS','1:156','1:BRT1','1:ALIBUS']:
              base='https://www.moovle.me/api/otp/'
              endpoint='https://moovle.azure-api.net/catania'
              url=base+'routes/'+urllib.parse.quote(route,safe=':')+'/patterns?'+urllib.parse.urlencode({'otpEndPoint':endpoint})
              meta,body=get(url)
              try:
                  patterns=json.loads(body)
                  meta['schema']=str(type(patterns))
                  meta['sample']=patterns[:1] if isinstance(patterns,list) else patterns
                  report['moovle_live'].append(meta)
                  for pattern in (patterns[:2] if isinstance(patterns,list) else []):
                      pid=pattern.get('Id',pattern.get('id',''))
                      stops=pattern.get('Stops',pattern.get('stops',[]))
                      if not stops:continue
                      selected=next((s for s in stops if 'milo' in s.get('Name',s.get('name','')).lower()),stops[len(stops)//2])
                      sid=selected.get('Id',selected.get('id',''))
                      url=base+'stoptimes?'+urllib.parse.urlencode({'otpEndPoint':endpoint,'stopId':sid,'patternId':pid})
                      m,b=get(url)
                      m['route']=route;m['stop']=selected
                      try:m['response']=json.loads(b)
                      except: m['response_excerpt']=b[:150]
                      report['moovle_live'].append(m)
              except Exception as e:
                  meta['parse_error']=str(e);meta['excerpt']=body[:150];report['moovle_live'].append(meta)
          import subprocess,zipfile,io,csv
          try:
              subprocess.run(['gh','run','download','42523720428','--repo','AndreaGirlando/Liotru-Express','--name','verifica-fonti','--dir','/tmp/previous-amts'],check=True,capture_output=True,text=True,timeout=60)
              files=list(Path('/tmp/previous-amts').rglob('official-gtfs.zip'))
              meta,body=get('https://proxy.busone.app/amts/gtfs-rt/trip-updates.json',10000000)
              feed=json.loads(body)
              ids={e.get('trip_update',e.get('tripUpdate',{})).get('trip',{}).get('trip_id') for e in feed.get('entity',[])}
              ids.discard(None)
              with zipfile.ZipFile(files[0]) as z:
                  name=next(n for n in z.namelist() if n.endswith('trips.txt'))
                  old={r['trip_id'] for r in csv.DictReader(io.StringIO(z.read(name).decode('utf-8-sig')))}
              report['static_alignment']={'previous_snapshot_run':42523720428,'current_feed_trip_count':len(ids),'matched_previous_static':len(ids & old),'unmatched_previous_static':len(ids-old),'unmatched_examples':list(sorted(ids-old))[:8]}
          except Exception as e:report['static_alignment']={'error':str(e)}


          report['mycicero_contract']=[]
          meta,body=get('https://www.mycicero.it/amt-ct/TPWebPortal/it/main.b495a39ddecaf210.js',10000000)
          meta['public_urls']=list(dict.fromkeys(re.findall(r"https?://[a-zA-Z0-9./_?=&%:-]+",body)))[:70]
          report['mycicero_contract'].append(meta)
          for needle in ['GetReal','getReal','getPalin','GetPalin','Prevision','prevision','RealTime','realtime','webservices','Service.asmx','config.json','environment','getStopTimes','GetTransits','GetWait','GetMonitor','GetNext']:
              matches=[]
              for match in list(re.finditer(re.escape(needle),body))[:5]:
                  snippet=body[max(0,match.start()-100):match.start()+180]
                  if not re.search(r'(?i)password|api.?key|access.?token|authorization',snippet):matches.append(snippet)
              if matches:report['mycicero_contract'].append({'needle':needle,'contexts':matches})
          for url in ['https://proxy.busone.app/amts/status.json','https://moovle.azure-api.net/catania/index/stops/1:1928/stoptimes']:
              meta,body=get(url,2000000)
              try:
                  data=json.loads(body)
                  meta['response']=data
              except:meta['excerpt']=body[:100]
              report.setdefault('additional_public_checks',[]).append(meta)


          report['stop_comparison']=[]
          endpoint='https://moovle.azure-api.net/catania'
          for stop in ['1006','1836']:
              for pattern in [None,'']:
                  params={'otpEndPoint':endpoint,'stopId':'1:'+stop}
                  if pattern is not None:params['patternId']=pattern
                  url='https://www.moovle.me/api/otp/stoptimes?'+urllib.parse.urlencode(params)
                  meta,body=get(url)
                  try:
                      data=json.loads(body)
                      if isinstance(data,list):
                          meta['count']=len(data);meta['realtime_count']=sum(bool(s.get('realtime')) for s in data)
                          meta['realtime_rows']=[s for s in data if s.get('realtime')][:10]
                      else:meta['response']=data
                  except:meta['excerpt']=body[:100]
                  report['stop_comparison'].append(meta)
          meta,body=get('https://proxy.busone.app/amts/gtfs-rt/trip-updates.json',10000000)
          updates=json.loads(body)
          now=int(datetime.datetime.now(datetime.timezone.utc).timestamp())
          report['oracle_comparison']={'sampled_at':now,'predictions':[]}
          for entity in updates.get('entity',[]):
              item=entity.get('trip_update',{})
              if item.get('trip',{}).get('route_id')!='BRT1':continue
              for stop in item.get('stop_time_update',[]):
                  if str(stop.get('stop_id')) not in ['1006','1836']:continue
                  arrival=stop.get('arrival',{});eta=arrival.get('time')
                  if eta is not None and now-120<=int(eta)<=now+1800:
                      report['oracle_comparison']['predictions'].append({'trip':item.get('trip'),'vehicle':item.get('vehicle'),'timestamp':item.get('timestamp'),'stop':stop})

          Path('source-research/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({k:report[k] for k in ['checked_utc','stop_comparison','oracle_comparison']},ensure_ascii=False,indent=2))
          PY
          python3 /tmp/research.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ricerca-fonti-bus
          path: source-research/report.json
          retention-days: 7
