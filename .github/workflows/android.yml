name: Verifica e APK Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verifica fonti pubbliche
        run: python3 tool/verify_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifica-fonti
          path: source-verification/
      - name: Verifica dati ufficiali FCE
        run: python3 tool/verify_fce.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifica-fce
          path: fce-verification/
      - name: Confronta il quadro orario Metro con i dati inclusi
        run: |
          python3 -m pip install pypdf==6.10.0
          python3 tool/prepare_metro_timetable.py fce-verification/official-metro.pdf fce-verification/official-fce.zip /tmp/verified-metro.json
          cmp assets/metro/timetable.json /tmp/verified-metro.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - id: format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Prepara formattazione per diagnosi
        if: failure() && steps.format.outcome == 'failure'
        run: dart format lib test
      - uses: actions/upload-artifact@v4
        if: failure() && steps.format.outcome == 'failure'
        with:
          name: codice-formattato
          path: |
            lib/**/*.dart
            test/**/*.dart
      - uses: actions/upload-artifact@v4
        if: failure() && steps.format.outcome == 'failure'
        with:
          name: dart-formatter-runtime
          path: |
            ${{ env.FLUTTER_ROOT }}/bin/cache/dart-sdk/bin/dart
            ${{ env.FLUTTER_ROOT }}/bin/cache/dart-sdk/bin/dartaotruntime
            ${{ env.FLUTTER_ROOT }}/bin/cache/dart-sdk/bin/snapshots/dartdev_aot.dart.snapshot
            ${{ env.FLUTTER_ROOT }}/bin/cache/dart-sdk/bin/snapshots/dartdev.dart.snapshot
            ${{ env.FLUTTER_ROOT }}/bin/cache/dart-sdk/version
      - uses: actions/upload-artifact@v4
        with:
          name: dipendenze-risolte
          path: pubspec.lock
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Importazione reale AMTS
        if: ${{ !cancelled() && hashFiles('source-verification/official-gtfs.zip') != '' }}
        env:
          CATANIABUS_REAL_GTFS: source-verification/official-gtfs.zip
        run: flutter test test/official_feed_check.dart test/download_official_check.dart test/realtime_live_check.dart --reporter expanded
      - name: Anteprime Flutter con dati AMTS reali
        if: ${{ !cancelled() && hashFiles('source-verification/official-gtfs.zip') != '' }}
        env:
          CATANIABUS_REAL_GTFS: source-verification/official-gtfs.zip
        run: flutter test --update-goldens test/visual_check.dart --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anteprime-interfaccia
          path: test/previews/*.png
          if-no-files-found: ignore
      - name: Prepara Gradle con retry e verifica SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/prepare_gradle.py
      - name: Preferisci Maven Central per le dipendenze dei plugin
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/ci_repositories.gradle ~/.gradle/init.d/catania-repositories.gradle
      - name: Prepara compilatore Kotlin verificato
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/prepare_kotlin.py
      - name: Conserva la firma personale per le build successive
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cataniabus-android-debug-signing-v1
      - run: flutter build apk --release
      - name: Pubblica APK diretto nelle Release
        if: hashFiles('assets/branding/liotru.png') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tool/publish_apk.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('build/app/outputs/flutter-apk/app-release.apk') != '' }}
        with:
          name: CataniaBus-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
